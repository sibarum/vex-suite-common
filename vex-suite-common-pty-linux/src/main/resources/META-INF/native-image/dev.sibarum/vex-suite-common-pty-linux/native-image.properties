# Calls into native code through java.lang.foreign (libc's pseudo-terminal calls): the image needs the
# Foreign Function & Memory API.
# Picked up by native-image from any jar that carries this file, so an application that depends on this jar
# inherits exactly these flags and writes none of them itself.
Args = -H:+UnlockExperimentalVMOptions -H:+ForeignAPISupport -H:-UnlockExperimentalVMOptions \
       --enable-native-access=ALL-UNNAMED
