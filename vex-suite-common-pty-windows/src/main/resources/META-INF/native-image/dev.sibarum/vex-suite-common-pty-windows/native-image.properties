# Calls into native code through java.lang.foreign (the pseudoconsole's kernel32 calls), and shares an
# arena across threads (ConPty): the image needs the Foreign Function & Memory API and shared arenas.
# Picked up by native-image from any jar that carries this file, so an application that depends on this jar
# inherits exactly these flags and writes none of them itself.
Args = -H:+UnlockExperimentalVMOptions -H:+ForeignAPISupport -H:+SharedArenaSupport -H:-UnlockExperimentalVMOptions \
       --enable-native-access=ALL-UNNAMED
